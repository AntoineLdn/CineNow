# Matrice d'affinité : humeur -> famille météo (ou "default") -> genre = score [0.0..1.0]
#
# Résolution : get_affinities(mood, condition) prend la section [mood.<famille>]
# si elle existe, sinon [mood.default]. La famille est déduite de la condition
# via weather_families.toml.
#
# Ajouter une humeur   = ajouter un bloc [nouvelle_humeur.*] ci-dessous.
# Ajouter une famille  = ajouter une section [humeur.<famille>] là où c'est utile.
# Aucun code à modifier dans les deux cas.

# ---------------------------------------------------------------- joy
[joy.default]
comedie = 0.8
animation = 0.7
familial = 0.7
romance = 0.5

[joy.sun]
comedie = 1.0
romance = 0.9
animation = 0.8
familial = 0.6
aventure = 0.5

[joy.rain]
comedie = 0.8
romance = 0.8
animation = 0.7
familial = 0.5

[joy.storm]
comedie = 0.7
animation = 0.7
familial = 0.6

[joy.snow]
animation = 0.9
familial = 0.9
comedie = 0.8
romance = 0.5

