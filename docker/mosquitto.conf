# max_packet_size doit être déclaré AVANT le listener pour être pris en compte.
# Fait sauter la limite par défaut (~10 Ko) : on autorise des paquets larges
# pour publier de gros catalogues de films. 256 Ko = très large marge.
max_packet_size 262144

listener 1883
allow_anonymous true

# Pas de persistance : les catalogues sont republiés par movie-service.
persistence false
